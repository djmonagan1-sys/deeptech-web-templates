<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiagnostiQS — Quantum Diagnostics, Powered by Diamond</title>
  <meta
    name="description"
    content="DiagnostiQS builds medical instruments around the nitrogen-vacancy center in diamond — detecting the body's faint magnetic signals at room temperature, with no cryogenics and no shielded room."
  />
  <meta name="theme-color" content="#0f0a1c" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="DiagnostiQS — Quantum Diagnostics, Powered by Diamond" />
  <meta
    property="og:description"
    content="NV-diamond quantum sensing for medicine: magnetocardiography, wearable MEG, and chip-scale NMR — at room temperature, no shielded room."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ====================== NAV ====================== -->
  <header class="nav" id="nav">
    <div class="container nav__inner">
      <a class="brand" href="#top" aria-label="Home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect class="bm-ring" x="3" y="3" width="26" height="26" />
          <rect class="bm-ring bm-ring--2" x="9" y="9" width="14" height="14" />
          <rect class="bm-core" x="14" y="14" width="4" height="4" />
        </svg>
        <span class="brand__name" data-bind="brand"></span>
      </a>

      <nav class="nav__links" id="nav-links" aria-label="Primary"></nav>

      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <span id="top"></span>

    <!-- ====================== HERO ====================== -->
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__main">
          <p class="kicker reveal"><span class="kicker__tick"></span><span data-bind="hero.kicker"></span></p>
          <h1 class="hero__title reveal">
            <span data-bind="hero.titleTop"></span>
            <span class="signal-text" data-bind="hero.titleAccent"></span>
          </h1>
          <p class="hero__lead reveal" data-bind="hero.lead"></p>
          <div class="hero__actions reveal" id="hero-actions"></div>
        </div>
        <aside class="hero__aside reveal">
          <div class="hero__figure" aria-hidden="true">
            <!-- line-art diamond lattice (NV centre highlighted) -->
            <svg viewBox="0 0 200 200" class="lattice">
              <line x1="100" y1="30" x2="40" y2="65"/><line x1="100" y1="30" x2="160" y2="65"/>
              <line x1="40" y1="65" x2="40" y2="135"/><line x1="160" y1="65" x2="160" y2="135"/>
              <line x1="40" y1="135" x2="100" y2="170"/><line x1="160" y1="135" x2="100" y2="170"/>
              <line x1="100" y1="30" x2="100" y2="100"/><line x1="40" y1="65" x2="100" y2="100"/>
              <line x1="160" y1="65" x2="100" y2="100"/><line x1="40" y1="135" x2="100" y2="100"/>
              <line x1="160" y1="135" x2="100" y2="100"/><line x1="100" y1="170" x2="100" y2="100"/>
              <circle cx="100" cy="30" r="7"/><circle cx="40" cy="65" r="7"/><circle cx="160" cy="65" r="7"/>
              <circle cx="40" cy="135" r="7"/><circle cx="160" cy="135" r="7"/><circle cx="100" cy="170" r="7"/>
              <circle cx="100" cy="100" r="9" class="nv"/>
            </svg>
          </div>
          <dl class="hero__stats" id="hero-stats"></dl>
        </aside>
      </div>
    </section>

    <!-- ====================== TRUST (marquee) ====================== -->
    <section class="trust" aria-label="Trusted by">
      <div class="container">
        <p class="trust__label" data-bind="trust.label"></p>
      </div>
      <div class="marquee" aria-hidden="true">
        <ul class="marquee__track" id="trust-logos"></ul>
      </div>
    </section>

    <!-- ====================== TECHNOLOGY ====================== -->
    <section class="section" id="technology">
      <div class="container">
        <header class="shead reveal" data-head="technology"></header>
        <div class="cards" id="tech-cards"></div>
        <ol class="howit" id="tech-steps"></ol>
      </div>
    </section>

    <!-- ====================== PRODUCTS ====================== -->
    <section class="section section--alt" id="products">
      <div class="container">
        <header class="shead reveal" data-head="products"></header>
        <div class="products" id="products-grid"></div>
      </div>
    </section>

    <!-- ====================== APPLICATIONS ====================== -->
    <section class="section" id="applications">
      <div class="container">
        <header class="shead reveal" data-head="applications"></header>
        <div class="apps" id="apps-grid"></div>
      </div>
    </section>

    <!-- ====================== BANNER ====================== -->
    <section class="banner">
      <div class="container banner__inner reveal">
        <h2 data-bind="banner.title"></h2>
        <p data-bind="banner.text"></p>
        <div id="banner-cta"></div>
      </div>
    </section>

    <!-- ====================== COMPANY ====================== -->
    <section class="section section--alt" id="company">
      <div class="container company">
        <div class="company__copy reveal">
          <header class="shead shead--left" data-head="company"></header>
          <div id="company-paragraphs"></div>
          <div class="company__values" id="company-values"></div>
        </div>
        <aside class="company__stats reveal" id="company-stats"></aside>
      </div>
    </section>

    <!-- ====================== CONTACT ====================== -->
    <section class="section" id="contact">
      <div class="container contact">
        <header class="shead shead--left reveal" data-head="contact"></header>
        <form class="form reveal" novalidate>
          <div class="form__row">
            <label><span>Name</span><input type="text" name="name" autocomplete="name" required /></label>
            <label><span>Work email</span><input type="email" name="email" autocomplete="email" required /></label>
          </div>
          <label><span>Organization</span><input type="text" name="org" autocomplete="organization" /></label>
          <label><span>Area of interest</span>
            <select name="interest" id="contact-interests"></select>
          </label>
          <label><span>What are you trying to measure?</span><textarea name="message" rows="4"></textarea></label>
          <button class="btn btn--primary" type="submit">Send message</button>
          <p class="form__note" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ====================== FOOTER ====================== -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <a class="brand" href="#top" aria-label="Home">
          <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect class="bm-ring" x="3" y="3" width="26" height="26" />
            <rect class="bm-ring bm-ring--2" x="9" y="9" width="14" height="14" />
            <rect class="bm-core" x="14" y="14" width="4" height="4" />
          </svg>
          <span class="brand__name" data-bind="brand"></span>
        </a>
        <p data-bind="footer.tagline"></p>
      </div>
      <nav class="footer__nav" id="footer-cols" aria-label="Footer"></nav>
    </div>
    <div class="container footer__bottom">
      <p>© <span id="year"></span> <span data-bind="footer.legal"></span></p>
      <p class="footer__fine" data-bind="footer.fine"></p>
    </div>
  </footer>

  <!-- Content first, then the renderer -->
  <script src="content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
